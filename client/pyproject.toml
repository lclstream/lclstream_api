[project]
name = "lclstream-api-client"
version = "0.1.0"
description = "A client library for accessing LCLStream API"
authors = []
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.11",
    "python-dateutil>=2.8.2",
    "typing-extensions>=4.7.1",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"


[tool.ruff]
# _generated/ is regenerated by regenerate.sh and never hand-edited; it gets
# its own ruff pass from openapi-generator-cli's own templates.
extend-exclude = ["_generated"]
extend = "../pyproject.toml"
target-version = "py311"

[tool.pyrefly]
project-includes = ["**/*.py"]
project-excludes = ["**/_generated/**/*.py"]
search-path = ["src"]
